name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            build_type: Debug
            cc: gcc
            cxx: g++
          - compiler: GCC
            build_type: Release
            cc: gcc
            cxx: g++
          - compiler: Clang
            build_type: Release
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows / MSVC / Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  esp32:
    name: ESP32 / Xtensa GCC 8.4 / Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('ci/esp32-smoke/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build ESP32 smoke project
        run: pio run --project-dir ci/esp32-smoke --environment esp32dev
